<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact us</title></head>
<body>
<h1>Contact us</h1>
<form action="thanks.html" method="get">
  <label>Full name <input name="name" required></label><br>
  <label>Email <input name="email" type="email" placeholder="you@example.com"></label><br>
  <label>Password <input name="pw" type="password"></label><br>
  <label>Country <select name="country"><option value="">Choose…</option><option value="au">Australia</option><option value="nz">New Zealand</option></select></label><br>
  <label><input type="checkbox" name="agree" value="yes"> I agree to the terms</label><br>
  <label>Message <textarea name="msg"></textarea></label><br>
  <button type="submit">Continue</button>
</form>
</body></html>
