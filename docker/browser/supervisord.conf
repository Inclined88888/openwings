; Wings browser processes. Selenium's Grid server is deliberately absent.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/wings/supervisord.pid
childlogdir=/tmp/wings

[program:xvfb]
; Xvfb plus the fluxbox window manager (Selenium's script, kept as is).
command=/opt/bin/start-xvfb.sh
priority=0
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=/opt/wings/vnc.sh
priority=5
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
; WebSocket bridge between two unix sockets; serves no files.
command=/bin/sh -c 'unset WINGS_BROWSER_TOKEN; rm -f /tmp/wings/novnc.sock; exec websockify --unix-listen=/tmp/wings/novnc.sock --unix-target=/tmp/wings/vnc.sock'
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:egress]
; Forward proxy for Chromium; refuses private and local destinations.
command=/bin/sh -c 'unset WINGS_BROWSER_TOKEN; exec python3 /opt/wings/egress_proxy.py'
priority=12
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chromium]
command=/opt/wings/chromium.sh
priority=15
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
; Chromium writes a lot of harmless noise to stderr. Keep a short local log.
stdout_logfile=/tmp/wings/chromium.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:guard]
command=python3 /opt/wings/guard_proxy.py
priority=20
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
